<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script type="module" src="./domManager.js"></script>
    <title>Document</title>
  </head>
  <body>
    <div class="header-container">
      <label for="search"></label>
      <input type="text" id="search" />
      <button class="unit">°C | °F</button>
    </div>
    <div class="container">
      <div class="address">
        <p class="location"></p>
        <p class="date"></p>
      </div>
      <div class="weather-info">
        <p class="temperature"></p>
        <p class="weather"></p>
        <p class="feels-like"></p>
      </div>
      <div class="more-info">
        <p class="humidity"></p>
        <p class="wind"></p>
        <p class="rain"></p>
      </div>
    </div>
  </body>
</html>
